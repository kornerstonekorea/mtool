<style>
  :root { --bg:#eef1f5; --card:#ffffff; --ink:#1c2430; --muted:#6b7684; --line:#d9dee5;
          --accent:#1f4e8c; --accent-ink:#ffffff; --err:#c0392b; }
  :root { color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme:dark; --bg:#0f1318; --card:#1b2129; --ink:#e6eaf0; --muted:#97a1ad; --line:#2f3844;
            --accent:#5b8fd6; --accent-ink:#0f1318; --err:#ff7b6b; }
  }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#0f1318; --card:#1b2129; --ink:#e6eaf0; --muted:#97a1ad; --line:#2f3844;
            --accent:#5b8fd6; --accent-ink:#0f1318; --err:#ff7b6b; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:16px; }
  .box { width:100%; max-width:460px; background:var(--card); border:1px solid var(--line);
         border-radius:14px; padding:36px 32px 28px; box-shadow:0 8px 30px rgba(0,0,0,.06); }
  h1 { margin:0 0 6px; font-size:clamp(16px, 5vw, 24px); color:var(--accent); white-space:nowrap; }   /* 제목 한 줄 */
  .brand { margin-bottom:24px; font-size:13px; letter-spacing:.02em; color:var(--muted); }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  input { width:100%; padding:11px 12px; font-size:15px; border:1px solid var(--line);
          border-radius:8px; background:transparent; color:var(--ink); outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  button { width:100%; margin-top:22px; padding:12px; font-size:15px; font-weight:600;
           border:0; border-radius:8px; background:var(--accent); color:var(--accent-ink); cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { min-height:20px; margin-top:12px; color:var(--err); font-size:13px; text-align:center; }
  .foot { margin-top:18px; text-align:center; font-size:12px; color:var(--muted); }

  /* 화면 테마 메뉴 (⋮ → System / Light / Dark) */
  .thwrap { position:relative; flex:none; }
  .thbtn { display:grid; place-items:center; width:32px; height:32px; padding:0; border:1px solid transparent; border-radius:6px;
           background:none; color:var(--ink); cursor:pointer; margin:0; }
  .thbtn:hover, .thbtn[aria-expanded="true"] { border-color:var(--line); background:var(--card); }
  .thmenu { position:absolute; top:calc(100% + 6px); right:0; z-index:50; display:flex; gap:6px; padding:8px;
            background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.18); }
  .thmenu[hidden] { display:none; }   /* 처음엔 닫힌 상태, ⋮ 를 누를 때마다 열기/닫기 */
  .thmenu button { display:flex; flex-direction:column; align-items:center; gap:6px; width:76px; padding:10px 4px;
                   border:1px solid transparent; border-radius:8px; background:none; color:var(--ink);
                   font:inherit; font-size:13px; cursor:pointer; margin:0; }
  .thmenu button:hover { background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .thmenu button.on { background:color-mix(in srgb, var(--accent) 16%, transparent); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .thcorner { position:fixed; top:16px; right:16px; }
  /* Google 로그인 */
  .gbox { margin-top:8px; }
  .gbtn { display:flex; justify-content:center; min-height:44px; }
  .gbtn[hidden] { display:none; }
  /* Google 버튼(iframe)은 밝은 문서라, 어두운 화면에서 흰 바탕이 깔리지 않도록 이 영역만 light 로 맞춤 */
  .gbtn { color-scheme:light; }
  .gbtn iframe { color-scheme:light; background:transparent !important; }
  /* 우리 로그인 버튼 (누르면 팝업 없이 바로 로그인 시도) */
  .ggo { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; height:44px; margin:0; padding:0 12px;
         border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink);
         font:inherit; font-size:15px; font-weight:600; cursor:pointer; }
  .ggo:hover:not(:disabled) { border-color:var(--accent); }
  .ggo:disabled { opacity:.6; cursor:wait; }
  .ggo[hidden] { display:none; }
  .glink { display:block; width:auto; margin:10px auto 0; padding:2px 6px; border:0; background:none; color:var(--accent);
           font:inherit; font-size:12px; font-weight:400; cursor:pointer; text-decoration:underline; }
  .glink[hidden] { display:none; }
  .gnote { margin:14px 0 0; text-align:center; font-size:12px; color:var(--muted); }
  .status { min-height:20px; margin-top:12px; color:var(--muted); font-size:13px; text-align:center; }
</style>
<script>
// http 로 열리면 https 로 다시 열기 (Google 로그인은 https 주소만 허용 · localhost 개발 화면은 제외)
if (location.protocol === "http:" && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname))
  location.replace("https://" + location.host + location.pathname + location.search + location.hash);
</script>
<script>
// 화면 테마: system(운영체제 설정) / light / dark — 화면 설정만 이 브라우저에 저장 (데이터와 무관)
(function () { var t = null; try { t = localStorage.getItem("mtool.theme"); } catch (_) {}
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); })();
</script>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
if (PAYLOAD && PAYLOAD.open) document.querySelectorAll("input[required]").forEach(i => i.required = false);

async function unlock(id, pw) {
  if (PAYLOAD.open) return new TextDecoder().decode(b64(PAYLOAD.b64));
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(id + "\n" + pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", hash:"SHA-256", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(plain);
}

/* ----- 화면 테마 메뉴 ----- */
(function () {
  const KEY = "mtool.theme", wrap = document.getElementById("thWrap"), btn = document.getElementById("thBtn"), menu = document.getElementById("thMenu");
  const get = () => { try { return localStorage.getItem(KEY) || "system"; } catch (_) { return "system"; } };
  const mark = t => menu.querySelectorAll("[data-theme-opt]").forEach(b => { const on = b.dataset.themeOpt === t; b.classList.toggle("on", on); b.setAttribute("aria-checked", String(on)); });
  const apply = t => {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
    try { t === "system" ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, t); } catch (_) {}
    mark(t);
    window.dispatchEvent(new Event("mtool-theme"));
  };
  const open = v => { menu.hidden = !v; btn.setAttribute("aria-expanded", String(v)); };
  mark(get());
  btn.addEventListener("click", e => { e.stopPropagation(); open(menu.hidden); });
  menu.addEventListener("click", e => { const b = e.target.closest("[data-theme-opt]"); if (b) apply(b.dataset.themeOpt); });
  document.addEventListener("click", e => { if (!menu.hidden && !wrap.contains(e.target)) open(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !menu.hidden) { open(false); btn.focus(); } });
})();

/* ----- Google 로그인
 *   - 처음(또는 12시간 지나면): Google 버튼 → 계정 선택(팝업) → Apps Script 확인 · 접속기록 → 열쇠 → 열기
 *   - 로그인에 성공하면 이 브라우저에 12시간 기억 → 그동안은 버튼만 누르면 팝업 없이 바로 열림 (접속기록은 Google 로그인 때만)
 *   - M.Tool 로그아웃 · "다른 계정으로 로그인" 을 누르면 기억 삭제 ----- */
const VER = "v2026.11.27-1401";
const SESS_KEY = "mtool.sess", SESS_HOURS = 12;
function uaText() {
  const u = navigator.userAgent;
  const b = /Edg\//.test(u) ? "Edge" : /OPR\//.test(u) ? "Opera" : /Chrome\//.test(u) ? "Chrome" : /Firefox\//.test(u) ? "Firefox" : /Safari\//.test(u) ? "Safari" : "기타";
  const o = /Windows/.test(u) ? "Windows" : /iPhone|iPad/.test(u) ? "iOS" : /Mac OS X/.test(u) ? "macOS" : /Android/.test(u) ? "Android" : /Linux/.test(u) ? "Linux" : "기타";
  return b + " / " + o;
}
const isDark = () => { const t = document.documentElement.getAttribute("data-theme");
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
function setStatus(msg, isErr) {
  document.getElementById("gStatus").textContent = isErr ? "" : msg;
  document.getElementById("err").textContent = isErr ? msg : "";
}
async function openWithKey(keyB64) {
  const key = await crypto.subtle.importKey("raw", b64(keyB64), { name:"AES-GCM" }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(plain);
}
/* 로그인 기억 */
function loadSess() {
  try {
    const v = JSON.parse(localStorage.getItem(SESS_KEY) || "null");
    if (v && v.k && v.exp > Date.now()) return v;
    localStorage.removeItem(SESS_KEY);
  } catch (_) {}
  return null;
}
function saveSess(k, email, name) {
  try { localStorage.setItem(SESS_KEY, JSON.stringify({ k, email, name, exp: Date.now() + SESS_HOURS * 3600e3 })); } catch (_) {}
}
function clearSess() { try { localStorage.removeItem(SESS_KEY); } catch (_) {} }
function tokenEmail(cred) {   // 화면 표시용 (확인은 Apps Script 가 함)
  try { const p = JSON.parse(decodeURIComponent(escape(atob(cred.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))))); return p.email || ""; }
  catch (_) { return ""; }
}
function openApp(html) { document.open(); document.write(html); document.close(); }

let gBusy = false;
async function onGoogle(resp) {
  if (gBusy) return;
  gBusy = true; setStatus("회사 계정 확인 중…");
  try {
    let r;
    try {
      // text/plain 으로 보내야 Apps Script 웹앱이 추가 확인 요청(preflight) 없이 받음
      const res = await fetch(PAYLOAD.scriptUrl, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: JSON.stringify({ token: resp && resp.credential, ua: uaText(), ver: VER }) });
      r = await res.json();
    } catch (_) { throw new Error("로그인 서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요."); }
    if (!r || !r.ok) throw new Error(r && r.reason === "회사 계정 아님"
      ? "회사 계정(@kornerstonekorea.com)으로만 접속할 수 있습니다."
      : "로그인할 수 없습니다" + (r && r.reason ? ` (${r.reason})` : "") + ".");
    let html;
    try { html = await openWithKey(r.key); }
    catch (_) { throw new Error("프로그램을 열 수 없습니다. 관리자에게 문의해 주세요. (열쇠 불일치)"); }
    saveSess(r.key, tokenEmail(resp && resp.credential), r.name || "");
    openApp(html);
  } catch (e) {
    setStatus(e.message || String(e), true);
    gBusy = false;
  }
}
/* 기억된 로그인으로 바로 열기 (Google · 팝업 없음) */
async function quickOpen() {
  const v = loadSess();
  if (!v) return showGoogle("");
  const go = document.getElementById("gGo"); go.disabled = true; setStatus("여는 중…");
  try { openApp(await openWithKey(v.k)); }
  catch (_) { clearSess(); go.disabled = false; showGoogle("다시 로그인해 주세요."); }   // 열쇠가 바뀐 경우 등
}
function renderGoogleButton() {
  const el = document.getElementById("gBtn");
  if (el.hidden || !window.google || !google.accounts) return;
  el.innerHTML = "";
  google.accounts.id.renderButton(el, { type:"standard", theme: isDark() ? "filled_black" : "outline", size:"large",
    text:"signin_with", shape:"rectangular", logo_alignment:"left", width:320, locale:"ko" });
}
let gsiReady = null;
function loadGsi() {
  if (gsiReady) return gsiReady;
  gsiReady = new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = () => {
      google.accounts.id.initialize({ client_id: PAYLOAD.clientId, callback: onGoogle, auto_select: false,
        cancel_on_tap_outside: true, hd: "kornerstonekorea.com", ux_mode: "popup" });
      google.accounts.id.disableAutoSelect();
      window.addEventListener("mtool-theme", renderGoogleButton);
      if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderGoogleButton);
      ok();
    };
    s.onerror = () => { gsiReady = null; fail(); };
    document.head.appendChild(s);
  });
  return gsiReady;
}
/* Google 버튼 화면 (처음 · 기억 만료 · 다른 계정) */
function showGoogle(msg) {
  document.getElementById("gGo").hidden = true;
  document.getElementById("gOther").hidden = true;
  const el = document.getElementById("gBtn"); el.hidden = false;
  setStatus(msg || "로그인 버튼을 불러오는 중…");
  loadGsi().then(() => { renderGoogleButton(); setStatus(msg || ""); })
    .catch(() => setStatus("Google 로그인 버튼을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.", true));
}
function initGoogle() {
  document.getElementById("pwBox").hidden = true;
  document.getElementById("gBox").hidden = false;
  document.querySelectorAll("#pwBox input").forEach(i => i.required = false);
  const v = loadSess();
  if (!v) return showGoogle("");
  // 기억된 로그인: 버튼 한 번으로 바로 열기
  const go = document.getElementById("gGo");
  document.getElementById("gGoTxt").textContent = "로그인" + (v.email ? ` (${v.email})` : v.name ? ` (${v.name})` : "");
  go.hidden = false; go.disabled = false; go.addEventListener("click", quickOpen);
  const other = document.getElementById("gOther");
  other.hidden = false;
  other.addEventListener("click", () => { clearSess(); showGoogle(""); });
}
if (PAYLOAD && PAYLOAD.google) initGoogle();

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  if (PAYLOAD && PAYLOAD.google) return;
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "확인 중…"; err.textContent = "";
  try {
    const html = await unlock(document.getElementById("uid").value.trim(), document.getElementById("pw").value);
    document.open(); document.write(html); document.close();
  } catch (_) {
    err.textContent = "아이디 또는 비밀번호가 올바르지 않습니다.";
    btn.disabled = false; btn.textContent = "로그인";
    document.getElementById("pw").select();
  }
});
</script>
