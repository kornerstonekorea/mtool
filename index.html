<style>

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);

  .box { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line);

  label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  input { width:100%; padding:11px 12px; font-size:15px; border:1px solid var(--line);
          border-radius:8px; background:transparent; color:var(--ink); outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  button { width:100%; margin-top:22px; padding:12px; font-size:15px; font-weight:600;
           border:0; border-radius:8px; background:var(--accent); color:var(--accent-ink); cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { min-height:20px; margin-top:12px; color:var(--err); font-size:13px; text-align:center; }
  .foot { margin-top:18px; text-align:center; font-size:12px; color:var(--muted); }
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
if (PAYLOAD && PAYLOAD.open) document.querySelectorAll("input[required]").forEach(i => i.required = false);

async function unlock(id, pw) {
  if (PAYLOAD.open) return new TextDecoder().decode(b64(PAYLOAD.b64));
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(id + "\n" + pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", hash:"SHA-256", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(plain);
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "확인 중…"; err.textContent = "";
  try {
    const html = await unlock(document.getElementById("uid").value.trim(), document.getElementById("pw").value);
    document.open(); document.write(html); document.close();
  } catch (_) {
    err.textContent = "아이디 또는 비밀번호가 올바르지 않습니다.";
    btn.disabled = false; btn.textContent = "로그인";
    document.getElementById("pw").select();
  }
});
</script>
